else if(sb){const r=await sb.auth.signInWithPassword({email:em,password:p1});if(r.error)throw r.error;const u=localUser(r.data.user,em,now);loginUser(u.id);return done(u)}
else{const u=S.users.find(x=>x.email===em&&x.h);if(!u||await hashPw(p1,u.salt)!==u.h){FAIL.n++;if(FAIL.n>=5){FAIL.until=now+3e4;FAIL.n=0}A.msg='Incorrect email or password'}else{FAIL.n=0;u.lastLogin=now;loginUser(u.id);return done(u)}}}
}catch(e){A.msg=fbMsg(e)}

function loginUser(id,keep){if(S.cur)save();if(!keep){const d=S.d[id];S.accts=d?d.accts:[];S.bids=d?d.bids:[];S.aNotify=d?d.aNotify:{};S.dels=d&&d.dels?d.dels:[]}S.cur=id;save()}
function forceOut(){save();stopSync();S.cur=0;S.accts=[];S.bids=[];S.aNotify={};S.dels=[];lsSave();closeS();authShow()}

window.pwForm=()=>sheet(`<h2 style="margin:0">Change password</h2><label>Current password</label><input id="c-o" type="password" autocomplete="current-password"><label>New password</label><input id="c-n" type="password" autocomplete="new-password"><label>Confirm password</label><input id="c-c" type="password" autocomplete="new-password"><div class="neg" id="c-m" style="margin-top:8px"></div><div class="row" style="margin-top:14px"><button class="btn o" onclick="closeS()">Cancel</button><button class="btn" onclick="pwSave()">Save password</button></div>`);

if(n.length<8){m.textContent='Password must be at least 8 characters';return}if(n!==c){m.textContent='Passwords do not match';return}
if(sb&&u.fb){try{const v=await sb.auth.signInWithPassword({email:u.email,password:o});if(v.error){m.textContent='Current password is incorrect';return}const r=await sb.auth.updateUser({password:n});if(r.error)throw r.error;closeS();toast('Password changed')}catch(e){m.textContent=fbMsg(e)}return}
if(!u.h||await hashPw(o,u.salt)!==u.h){m.textContent='Current password is incorrect';return}u.salt=newSalt();u.h=await hashPw(n,u.salt);save();closeS();toast('Password changed')};
const STG=[['exch','Submitted to exchange'],['bank','Request accepted by sponsor bank'],['client','Request accepted by client']],DLY=[3e3,10e3,20e3];
const T=k=>(TR[S.lang]||{})[k]||k;
function startFlow(b){b.p0=Date.now();b.st=[]}
function advance(){if(!S.cur)return;let ch=0;S.bids.forEach(b=>{if(b.status!=='Success'||!b.p0)return;b.st=b.st||[];while(b.st.length<3&&Date.now()-b.p0>=DLY[b.st.length]){const k=STG[b.st.length],tt=b.p0+DLY[b.st.length];b.st.push({k:k[0],t:tt});b.up=Date.now();ch++;if(S.notif.bid!==false&&Date.now()-tt<6e4)alertUser(b.n+': '+T(k[1]))}});if(ch){save();updBell();if(page==='bids'&&!$('#ov'))go('bids')}}
setInterval(advance,2000);
const tl=b=>`<div style="margin-top:8px">${STG.map((k,i)=>{const x=(b.st||[])[i];return`<div class="stp ${x?'ok':''}"><span class="dt">${x?'✓':i+1}</span><div>${k[1]}${x?`<div class="mu">${ft(x.t)}</div>`:''}</div></div>`}).join('')}</div>`;
function notes(){const a=[];S.bids.forEach(b=>(b.st||[]).forEach((x,i)=>a.push({n:b.n,l:STG[i][1],t:x.t})));(S.feed||[]).forEach(f=>a.push({n:f.n,l:f.m,t:f.t}));return a.sort((x,y)=>y.t-x.t)}
function updBell(){const u=cur(),c=notes().filter(x=>x.t>((u&&u.seen)||0)).length;$('#bc').textContent=c?' '+c:''}
window.bell=()=>{const u=cur(),a=notes();sheet(`<h2 style="margin:0">Notifications</h2>${a.map(x=>`<div class="card"><div class="b">${x.n}</div><div><span>✓</span> ${x.l}</div><div class="mu">${ft(x.t)}</div></div>`).join('')||'<p class="mu">No notifications yet.</p>'}<button class="btn o l" style="width:100%" onclick="closeS()">Close</button>`);if(u){u.seen=Date.now();save();updBell()}};
// ---- LIVE DATA (Netlify function /api/ipos) ----
const DATA_URL='/api/ipos';let LIVE=false,SRC='';
const dt=x=>x?new Date(x+'T00:00:00').getTime():0;
const fromApi=o=>{const u=o.subscription||{};return{n:o.name,ty:o.type==='SME'?'SME':'Mainboard',o:dt(o.open),c:dt(o.close),lo:+o.priceLow||0,hi:+o.priceHigh||0,lot:+o.lot||1,sz:+o.issueSizeCr||0,g:+o.gmp||0,h:o.gmpHeard||'—',al:dt(o.allotment),li:dt(o.listing),rg:o.registrar||'—',drhp:o.drhpUrl||'',anchor:o.anchorUrl||'',out:o.allotmentOut,su:{r:+u.retail||0,n:+u.nii||0,q:+u.qib||0},bs:o.financials||[[2024,0,0,0],[2025,0,0,0],[2026,0,0,0]]}};
const MSN=[1,2,5,10,20,50,100];
function detect(list){const old=S.snap,neu={},ev=[];
list.forEach(i=>{const out=(i.out!==undefined&&i.out!=='')?/^(y|yes|true|1)$/i.test(String(i.out)):!!(i.al&&day(0)>=i.al),n=neu[i.n]={g:i.g,r:i.su.r,n:i.su.n,q:i.su.q,d:!!i.drhp,a:!!i.anchor,o:out},o=old&&old[i.n];if(!o)return;
[['r','Retail'],['n','NII'],['q','QIB']].forEach(([k,l])=>{const m=MSN.filter(x=>o[k]<x&&n[k]>=x).pop();if(m)ev.push(['sub',i.n,l+' subscription crossed '+m+'x (now '+n[k]+'x)'])});
if(Math.abs(i.g-o.g)>=Math.max(1,i.hi*0.02))ev.push(['gmp',i.n,'GMP changed '+R(o.g)+' to '+R(i.g)]);
if(!o.d&&n.d)ev.push(['drhp',i.n,'DRHP/RHP filed']);if(!o.a&&n.a)ev.push(['anchor',i.n,'Anchor investor list released']);if(!o.o&&n.o)ev.push(['allot',i.n,'Allotment is out'])});
S.snap=neu;if(old&&S.cur)ev.forEach(([k,n,m])=>{S.feed.unshift({t:Date.now(),n,m,k});if(S.notif[k]!==false)alertUser(n+': '+m)});S.feed=S.feed.slice(0,100);save();updBell()}
window.docOpen=(n,t)=>{const i=IPOS.find(x=>x.n===n),u=t.startsWith('DRHP')?i.drhp:t.startsWith('ANCHOR')?i.anchor:'';if(u&&/^https?:\/\//i.test(u))window.open(u,'_blank','noopener');else toast(t+': not available yet')};
const rowApi=r=>({name:r.name,type:r.type,open:r.open_date,close:r.close_date,priceLow:r.price_low,priceHigh:r.price_high,lot:r.lot,issueSizeCr:r.issue_size_cr,gmp:r.gmp,gmpHeard:r.gmp_heard,allotment:r.allotment_date,listing:r.listing_date,registrar:r.registrar,subscription:{retail:r.sub_retail,nii:r.sub_nii,qib:r.sub_qib},drhpUrl:r.drhp_url,anchorUrl:r.anchor_url,allotmentOut:r.allotment_out===null?undefined:r.allotment_out});
async function loadLive(manual){try{let j=null;if(sb){try{const q=await sb.from('ipos').select('*');if(!q.error&&q.data&&q.data.length)j={source:'Supabase',updatedAt:new Date(Math.max(...q.data.map(r=>new Date(r.updated_at).getTime()||0))).toISOString(),ipos:q.data.map(rowApi)}}catch(e){}}
if(!j){const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw 0;j=await r.json()}if(!j.ipos||!j.ipos.length)throw 0;IPOS=j.ipos.map(fromApi);LIVE=true;detect(IPOS);SRC=j.source||'server';lastRef=j.updatedAt?new Date(j.updatedAt).getTime():Date.now();if(S.cur&&!$('#ov'))go(page);if(manual)toast('Updated')}catch(e){if(manual)toast(LIVE?'Could not refresh, showing last data':'Live server not reachable')}}
setInterval(()=>{if(document.visibilityState==='visible')loadLive()},300000);
if(sb){sb.channel('ipos-live').on('postgres_changes',{event:'*',schema:'public',table:'ipos'},()=>{clearTimeout(window._rt);window._rt=setTimeout(loadLive,1500)}).subscribe()}
// ---- SYNC accounts + bids between phones (Supabase table user_data) ----
let _st=null,_lastPush='',_syncing=false,_ch=null,_rt2=null;
const blob=()=>({accts:S.accts,bids:S.bids,aNotify:S.aNotify,dels:S.dels||[]});
function mergeIn(r){const before=JSON.stringify(blob()),dels=[...new Set([...(S.dels||[]),...(r.dels||[])])];
const pick=(a,b)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{const o=m.get(x.id);if(!o||(x.up||0)>(o.up||0))m.set(x.id,x)});return[...m.values()]};
S.dels=dels;S.accts=pick(S.accts,r.accts).filter(a=>!dels.includes(a.id));S.bids=pick(S.bids,r.bids).sort((a,b)=>(b.made||0)-(a.made||0));S.aNotify=Object.assign({},r.aNotify||{},S.aNotify||{});
return JSON.stringify(blob())!==before}
const syncUser=()=>{const u=cur();return sb&&u&&u.fb?u:null};
async function pullSync(){const u=syncUser();if(!u)return;try{const q=await sb.from('user_data').select('data').eq('user_id',u.id).maybeSingle();if(q.error)throw q.error;
if(q.data&&q.data.data&&JSON.stringify(q.data.data)!==_lastPush&&mergeIn(q.data.data)){lsSave();if(S.cur&&!$('#ov'))go(page);syncSoon()}}catch(e){}}
async function pushSync(){const u=syncUser();if(!u||_syncing)return;_syncing=true;try{const q=await sb.from('user_data').select('data').eq('user_id',u.id).maybeSingle();let ch=false;if(q.data&&q.data.data)ch=mergeIn(q.data.data);
if(ch)lsSave();const b=blob(),j=JSON.stringify(b);if(j!==_lastPush){const r=await sb.from('user_data').upsert({user_id:u.id,data:b},{onConflict:'user_id'});if(!r.error)_lastPush=j}
if(ch&&S.cur&&!$('#ov'))go(page)}catch(e){}finally{_syncing=false}}
function syncSoon(){try{if(!syncUser())return;clearTimeout(_st);_st=setTimeout(pushSync,2000)}catch(e){}}
function stopSync(){try{clearTimeout(_st);if(_ch&&sb){sb.removeChannel(_ch)}_ch=null;_lastPush=''}catch(e){}}
function startSync(){const u=syncUser();if(!u)return;stopSync();pushSync();try{_ch=sb.channel('ud-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'user_data',filter:'user_id=eq.'+u.id},()=>{clearTimeout(_rt2);_rt2=setTimeout(pullSync,800)}).subscribe()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullSync()});
const NAV=[['ipo','▦','IPO'],['acc','☰','Account'],['bids','✎','Bids'],['allot','✔','Allotment'],['set','⚙','Settings']];

$('#v').innerHTML=({ipo:ipoPage,bids:bidsPage,allot:allotPage,cal:calPage,set:setPage,acc:()=>{window._sec='acc';return setPage()}})[p]();tr(document.body)}
